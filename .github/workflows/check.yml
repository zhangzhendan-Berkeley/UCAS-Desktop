name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests==2.32.5 PySide6==6.10.1
      - run: python -m compileall -q app.py ucasdesk adapters scripts tests
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: |
          node --check adapters/lecture.mjs
          node --check adapters/lecture_schedule.mjs
          node --check adapters/lecture_observe.mjs
          node --test tests/lecture_history.test.mjs
          node --check adapters/mooc.mjs
