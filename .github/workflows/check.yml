name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - os: macos-15
            python: .venv/bin/python
          - os: ubuntu-24.04
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux desktop and keyring dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 fonts-noto-cjk libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install pinned modules
        run: python scripts/setup.py --with-external-modules
      - name: Python unit tests
        run: |
          ${{ matrix.python }} -m compileall -q app.py ucasdesk adapters scripts tests
          ${{ matrix.python }} -m unittest discover -s tests -v
          ${{ matrix.python }} -m unittest tests.test_macos_support.FontTests -v
      - name: JavaScript regression tests
        run: |
          for file in adapters/*.mjs mobile/*.mjs; do node --check "$file"; done
          node --test tests/*.test.mjs
      - name: Offline UI and process tests
        run: |
          for file in automation_ui_smoke profile_planner_smoke dashboard_ui_smoke refresh_ui_smoke macos_jobs_smoke; do
            ${{ matrix.python }} tests/$file.py
          done
      - name: Native Linux keyring test
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euc '
            export XDG_DATA_HOME="$(mktemp -d)"
            printf "%s" "disposable-ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
            .venv/bin/python scripts/linux_keyring_self_test.py
          '
      - name: Offline browser tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- ${{ matrix.python }} tests/sep_browser_smoke.py
          else
            ${{ matrix.python }} tests/sep_browser_smoke.py
          fi
          node tests/lecture_portal_smoke.mjs
          node tests/lecture_campus_smoke.mjs
          node tests/lecture_pagination_smoke.mjs
          node tests/lecture_captcha_smoke.mjs
          ${{ matrix.python }} tests/lecture_patch_smoke.py
      - name: Native macOS Keychain test
        if: runner.os == 'macOS'
        run: ${{ matrix.python }} scripts/keychain_self_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-${{ matrix.os }}
          path: logs/previews/
          if-no-files-found: ignore
