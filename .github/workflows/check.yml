name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests==2.32.5
      - run: python -m compileall -q app.py ucasdesk adapters scripts tests
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: |
          node --check adapters/lecture.mjs
          node --check adapters/lecture_schedule.mjs
          node --check adapters/mooc.mjs
