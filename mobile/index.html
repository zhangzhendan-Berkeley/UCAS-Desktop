<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123b36">
<link rel="manifest" href="manifest.webmanifest">
<title>UCAS 桌面助手 · 手机面板</title>
<style>
body{font:16px system-ui;margin:0;background:#f2f5f2;color:#173832}
main{max-width:700px;margin:auto;padding:28px 20px}
h1{font-size:26px}small{color:#62746a}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #cedad3;border-radius:10px}
button{background:#145d4e;color:white;border:0;font-weight:600}
article{padding:18px;margin:12px 0;background:white;border-radius:14px;border:1px solid #dce4de}
#status{margin:16px 0;color:#666}.pill{float:right;font-size:12px;padding:5px 9px;border-radius:15px;background:#e8f1eb}
footer{line-height:1.8;font-size:13px;color:#62746a;margin-top:24px}
label{display:block;margin-top:14px;font-size:13px;color:#62746a}
</style>
<main>
  <small>UCAS DESKTOP / 雁栖湖</small>
  <h1>任务状态，随时查看</h1>
  <p>电脑保持运行时，此处显示桌面助手的任务记录。</p>
  <label for="api-url">桌面助手 API 地址</label>
  <input id="api-url" type="url" placeholder="例如 https://你的隧道.trycloudflare.com">
  <label for="token">访问密钥</label>
  <input id="token" type="password" placeholder="输入桌面助手显示的访问密钥" autocomplete="off">
  <button id="connect">连接并刷新</button>
  <div id="status">尚未连接</div>
  <section id="jobs"></section>
  <footer>
    手机页面只显示状态，任务仍在你的电脑上运行。<br>
    若单独部署页面，请填写自己桌面助手的 API 地址；外网连接需使用 HTTPS。
    不要把访问密钥发给别人。
  </footer>
</main>
<script type="module">
import {apiBase, initialConnection, createConnection} from './connection.mjs';
const params = new URLSearchParams(location.search);
const apiBox = document.getElementById('api-url');
const tokenBox = document.getElementById('token');
const status = document.getElementById('status');
const labels = {running:'运行中',completed:'已结束',attention:'待处理：仍有未完成项',failed:'执行失败',stopped:'已停止',interrupted:'已中断',stopping:'停止中'};
const initial = initialConnection({origin:location.origin, requested:params.get('api'),
  fragment:location.hash.slice(1), savedBase:sessionStorage.getItem('ucasApiUrl'), savedToken:sessionStorage.getItem('ucasToken')});
apiBox.value = initial.base;
tokenBox.value = initial.token;
history.replaceState(null, '', location.pathname);
const connection = createConnection(fetch, (base, token) => {
  sessionStorage.setItem('ucasApiUrl', base);
  sessionStorage.setItem('ucasToken', token);
});
function render(items) {
  if (!items) return;
  document.getElementById('jobs').replaceChildren(...items.map(item => {
    const article = document.createElement('article'), pill = document.createElement('span');
    const title = document.createElement('strong'), updated = document.createElement('p');
    pill.className = 'pill'; pill.textContent = labels[item.status] || item.status;
    title.textContent = item.title; updated.textContent = item.updated;
    article.append(pill, title, updated); return article;
  }));
  status.textContent = items.length ? '已更新 ' + new Date().toLocaleTimeString() : '暂无任务';
}
async function connect() {
  try { status.textContent='正在连接…'; render(await connection.connect(apiBox.value.trim(),tokenBox.value)); }
  catch (error) { status.textContent=error.name==='AbortError'?'连接已取消或超时':error.message; }
}
apiBox.addEventListener('input', () => {
  connection.disconnect(); tokenBox.value=''; document.getElementById('jobs').replaceChildren();
  status.textContent='地址已修改，请核对地址、填写对应密钥，再点击连接。';
});
tokenBox.addEventListener('input', () => { connection.disconnect(); status.textContent='密钥已修改，请点击连接。'; });
document.getElementById('connect').onclick=connect;
if (initial.automatic && initial.token) connect();
setInterval(async () => {
  try { render(await connection.refresh()); }
  catch (error) { if(error.name!=='AbortError') status.textContent=error.message; }
},15000);
</script>
</html>
